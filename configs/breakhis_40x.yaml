# BreakHis 40X — first controlled experiment configuration (Milestone 1 scope).
# NOTE: BreakHis is NOT a WSI dataset. It is a controlled histopathology-image
# benchmark used to test the fundamental relational hypothesis (see README §scope).

dataset:
  name: breakhis
  magnification: 40X          # one of: 40X, 100X, 200X, 400X, all
  # data_root is resolved from GPCN_DATA_ROOT or <repo>/data if left null.
  data_root: null

split:
  strategy: patient_level     # the ONLY allowed strategy — never split by image
  ratios: [0.70, 0.15, 0.15]  # train / val / test (by patient) for prototype split
  n_splits: 5                 # folds for --cv (reported results)
  seed: 42

reproducibility:
  seed: 42
  deterministic: false        # best-effort; may cost GPU performance (§17)

# --- Baseline 0: independent patch ViT classifier (docs/baseline0_spec.md) ---
# FIXED backbone for the whole ladder so comparisons isolate relational reasoning.
model:
  name: patch_vit
  backbone: vit_small_patch16_224   # ImageNet pretrained, fine-tuned
  num_classes: 2
  pretrained: true
  freeze_backbone: false            # fine-tune (do not freeze) for primary experiment

training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.00003            # 3e-5, AdamW
  weight_decay: 0.0001
  # Checkpoint selection = LOWEST validation loss (mean class-weighted CE over
  # val images). Patient/image ROC-AUC/PR-AUC are logged per epoch as diagnostics
  # only — val ROC-AUC saturates on 13 patients so it cannot select epochs.
  threshold_objective: balanced_accuracy  # thresholds chosen on VAL only, PER LEVEL
  # Imbalance handled via fold-local class-weighted loss (no oversampling).

graph:
  type: null                  # unused until Baseline 3+
